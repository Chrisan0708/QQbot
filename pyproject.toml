[project]
name = "QQbot"
version = "0.1.0"
description = "QQbot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-analysis-bilibili>=2.8.4",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-capoo>=1.0.0",
    "nonebot-plugin-auto-sendlike>=0.0.12",
    "nonebot-plugin-cs2radar>=0.2.2",
    "nonebot-plugin-hotsearch>=0.1.1",
    "nonebot-plugin-aitalk>=3.13.38",
]

[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
    {name = "OneBot V12", module_name = "nonebot.adapters.onebot.v12"}
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-analysis-bilibili = ["nonebot_plugin_analysis_bilibili"]
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]
nonebot-plugin-capoo = ["nonebot_plugin_capoo"]
nonebot-plugin-auto-sendlike = ["nonebot-plugin-auto-sendlike"]
nonebot-plugin-cs2radar = ["nonebot_plugin_cs2radar"]
nonebot-plugin-hotsearch = ["nonebot_plugin_hotsearch"]
nonebot-plugin-aitalk = ["nonebot_plugin_aitalk"]



